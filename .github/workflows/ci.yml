name: CI

# Build, type-check, lint and unit tests on every pull request; the end-to-end suite on pull requests that are ready
# for review (the Scope step below says what each run checks). Pull requests only (rule 988, 2026-10-10): a merge into
# main was checked in full as its pull request, and the live site is Hostinger, from the `production` branch, through a
# release pull request that runs this same check. The push run on main existed only for the old Vercel project's
# Deployment Check, which waited for "Nashr CI" on main's commits; Vercel no longer builds the site.
on:
  pull_request:
    # ready_for_review: marking a draft ready starts the full suite (see the Scope step).
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pull requests report the check under this name; a required check or ruleset names it, so keep it stable.
    name: Nashr CI
    runs-on: ubuntu-latest
    # Rule 1211, raised by rule 2511: unit tests take about 7 minutes, their second pass in production's person shape
    # (ready pull requests only) about 7 more and the end-to-end suite about 14, so a passing ready run ends near 31
    # minutes; 40 leaves room without hiding a hang for long. A draft run is unchanged.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so the Scope step can diff the pull request against its base.
          fetch-depth: 0
      # Green reuse (rules 2580-2582): a full run (build, type-check, lint, every unit test and the end-to-end suite) that
      # passed records the tree it checked; a later run of the same pull request on the identical tree and workflow
      # passes without checking again. The key is the tree of GitHub's merge commit, so any changed file, in the PR or
      # in its base, gives a new key; the workflow and selector hashes are named too, although the tree already holds
      # them. That covers a re-run with no change, a reopened PR, `gh pr ready` on a tree that was green, and merging
      # main into the PR right before the merge when main has not moved since the last full run. A cache saved by a
      # pull request is read only by that pull request's runs.
      - name: Green key
        id: green-key
        env:
          WORKFLOW_HASH: ${{ hashFiles('.github/workflows/ci.yml', 'scripts/ci-affected.mjs') }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "key=ci-green-v1-$RUNNER_OS-$tree-$WORKFLOW_HASH" >> "$GITHUB_OUTPUT"
      - name: Find green run
        id: green
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ci-green
          key: ${{ steps.green-key.outputs.key }}
      # What this run checks, to keep inside the plan's Actions minutes (a full run is about 20 minutes, 12 of them the
      # end-to-end suite). A draft PR skips the end-to-end suite: it runs once the PR is marked ready for review and on
      # every push after that, and GitHub cannot merge a draft, so every PR gets that run first. A PR that touches only
      # docs/, .archify/ or a top-level .md file runs the unit tests alone (they read the docs). The job itself always
      # runs and always reports "Nashr CI": a workflow skipped by `paths`/`paths-ignore` would never report it.
      # A draft PR into main runs only the unit tests its change reaches (`unit=affected`, rule 2583, the Select unit
      # tests step); a ready PR and a release PR into production run them all. A reused green run (`reused=true`) runs
      # only the secret scan.
      - name: Scope
        id: scope
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref }}
          GREEN_HIT: ${{ steps.green.outputs.cache-hit }}
          GREEN_FILE: ${{ runner.temp }}/ci-green
          TREE: ${{ steps.green-key.outputs.tree }}
        run: |
          build=false; e2e=false; unit=all; reused=false
          # The restored record must name this very tree; anything else is not a reuse.
          if [ "$GREEN_HIT" = true ] && [ -n "$TREE" ] && grep -qx "tree=$TREE" "$GREEN_FILE" 2>/dev/null; then
            reused=true; unit=none
            echo "This tree already passed the full check:"; cat "$GREEN_FILE"
          else
            # A pull_request run checks out GitHub's merge commit: its first parent is the base, so HEAD^1..HEAD is the PR.
            changed=$(git diff --name-only HEAD^1 HEAD 2>/dev/null) || changed=""
            if [ -z "$changed" ] || printf '%s\n' "$changed" | grep -qvE '^(docs/|\.archify/)|^[^/]+\.md$'; then build=true; fi
            if [ "$build" = true ] && [ "$DRAFT" != true ]; then e2e=true; fi
            if [ -n "$changed" ] && [ "$DRAFT" = true ] && [ "$BASE_REF" != production ]; then unit=affected; fi
            printf '%s\n' "$changed" | head -40
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          echo "build=$build e2e=$e2e unit=$unit reused=$reused"
      # Secret scan of this pull request's own commits (rule 1355, 360 study J-004): a key, token or password pasted into
      # a commit fails the run before anything else is installed. gitleaks is a single binary, downloaded at a fixed
      # version and checked against its published SHA-256, so no third-party action runs; a few seconds of the job.
      # `HEAD^1..HEAD^2` is the PR's commits on GitHub's merge checkout (the Scope step above). `--redact` keeps a found
      # value out of the log. `.gitleaks.toml` is the default rule set plus the fake values the tests use.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          range="HEAD^1..HEAD^2"; git rev-parse -q --verify HEAD^2 >/dev/null || range="HEAD^1..HEAD"
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$range" --config .gitleaks.toml --redact --no-banner --exit-code 1
      # Node 22 and the webpack build, the same as thakeen.com's Hostinger build (docs/system/architecture.md, "Build":
      # Node 22, `npm run build:hostinger`). CI built with Turbopack on Node 24, so a webpack-only or Node 22-only failure
      # showed up only when the release pull request was merged and Hostinger built (rule 1017).
      - name: Set up Node
        if: steps.scope.outputs.reused != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.scope.outputs.reused != 'true'
        run: npm ci
      # Next's build cache (webpack's under `.next/cache`, as on Hostinger). A cache saved by a pull request is readable
      # only by later runs of that pull request (and a base branch's cache by all of them, but main runs no CI, rule 988),
      # so the first run of a PR builds cold and every push after it starts warm. The key moves with the lockfile and
      # the sources; restore-keys falls back to the newest cache for the same lockfile, then to any. Restored here and
      # saved right after the Build step (rule 1208), not in a post-job step: that one runs only when the whole job
      # passes, so a red or cancelled end-to-end suite used to throw the build cache away and the next push built cold.
      - name: Restore Next build cache
        id: next-cache
        if: steps.scope.outputs.build == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'content/**', 'public/**', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      # Must run BEFORE the type-check. tsconfig includes `.next/types/**` and `next-env.d.ts`, and .gitignore ignores
      # both, so in a fresh checkout they do not exist and `tsc --noEmit` checks a strictly smaller program than a
      # developer's local run — every one of Next's generated route-signature validators is skipped. A renamed route
      # segment merged green and left main unbuildable, which only the host's failed deploy showed.
      # It is also the run's only build: made without APP_ENV, as thakeen.com's is, and the end-to-end server starts this
      # same `.next` with APP_ENV=test at runtime instead of building again (rule 1207, `e2e/web-server.ts`).
      - name: Build
        if: steps.scope.outputs.build == 'true'
        run: npm run build:hostinger
      - name: Save Next build cache
        if: steps.scope.outputs.build == 'true' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Type-check
        if: steps.scope.outputs.build == 'true'
        run: npx tsc --noEmit -p .
      - name: Lint
        if: steps.scope.outputs.build == 'true'
        run: npx eslint
      # Rules 2583-2586: on a draft, the test files the PR's change reaches through imports or by naming a changed path,
      # plus every test that reads a folder; `all` when a shared file (package.json, the lockfile, vitest.config.mts,
      # tests/helpers/, src/lib/db.ts, src/lib/keys.ts, this workflow...) or content/ changed. Type-check and lint above
      # still cover every file. `--no-renames` lists a moved file's old path too, so a test that still names it runs.
      - name: Select unit tests
        id: select
        if: steps.scope.outputs.unit == 'affected'
        run: |
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          if ! node scripts/ci-affected.mjs "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/unit-tests.txt"; then
            echo "::warning::test selection failed, running every unit test"; echo all > "$RUNNER_TEMP/unit-tests.txt"
          fi
          echo "list=$RUNNER_TEMP/unit-tests.txt" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        if: steps.scope.outputs.unit != 'none'
        env:
          LIST: ${{ steps.select.outputs.list }}
        run: |
          if [ -n "$LIST" ] && [ -s "$LIST" ] && [ "$(head -n 1 "$LIST")" != all ]; then
            mapfile -t files < "$LIST"; npx vitest run "${files[@]}"
          else
            npx vitest run
          fi
      # Rule 2510: the same unit tests with the person shape every production login has until multi-workspace M2
      # (`TEST_PERSONS=legacy`, tests/helpers/session.ts). The step above runs the `p_` shape M2 will sign up; a site
      # that reads one shape wrongly passes there and fails here. On ready pull requests only (the run before every
      # merge), so a draft push costs what it did.
      - name: Unit tests (production person shape)
        if: steps.scope.outputs.e2e == 'true'
        env:
          TEST_PERSONS: legacy
        run: npx vitest run
      # Playwright's browsers, keyed on the installed Playwright version. A cache saved by a pull request serves only
      # that PR, so a PR's first end-to-end run downloads them (about 30 seconds) and its later runs restore them.
      # The key also names the runner's OS release (rule 3210): WebKit is built per Ubuntu release, and one saved on
      # ubuntu-24.04 does not start on ubuntu-26.04 (libicudata.so.74 missing), as PR #437 found while `ubuntu-latest`
      # moved between them.
      - name: Playwright version
        id: playwright
        if: steps.scope.outputs.e2e == 'true'
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$(. /etc/os-release && echo "$ID$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.playwright.outputs.version != ''
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}-chromium-webkit
      # Rule 3211: both installs are bounded, so a slow download fails the step instead of eating the job's 40-minute
      # cap. The browsers come from Playwright's CDN (about 20 seconds): two tries of 5 minutes, on a cache miss only.
      # The system packages come from apt on every run, cached or not, since they live outside the cached directory.
      # On PR #442 the runner's Azure mirror sent them at about 40 KB/s (142 MB to fetch), so after a first try of
      # 6 minutes the next two use archive.ubuntu.com. They run as root under `timeout`, so a kill reaches apt-get
      # and frees the dpkg lock; a try that ran as the runner user left apt-get holding it and the retries failed.
      - name: Install Playwright browsers
        if: steps.scope.outputs.e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for try in 1 2; do
            timeout 5m npx playwright install chromium webkit && exit 0
            echo "::warning::Playwright browsers try $try failed or ran past 5 minutes"
          done
          exit 1
      - name: Install Playwright system dependencies
        if: steps.scope.outputs.e2e == 'true'
        run: |
          for try in 1 2 3; do
            sudo env "PATH=$PATH" timeout --kill-after=30s 6m npx playwright install-deps chromium webkit && exit 0
            echo "::warning::Playwright system dependencies try $try failed or ran past 6 minutes; next try uses archive.ubuntu.com"
            sudo pkill -x apt-get || true; sleep 5
            sudo dpkg --configure -a || true
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          done
          exit 1
      - name: End-to-end tests
        if: steps.scope.outputs.e2e == 'true'
        run: npx playwright test
      - name: Upload Playwright report
        if: failure() && steps.scope.outputs.e2e == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/.report
          retention-days: 7
      # Rule 2582: only a run that checked everything records its tree: Scope's e2e is true only on a ready PR that
      # builds, and then unit is all. A draft, docs-only, affected-only or reused run records nothing.
      - name: Record green run
        if: success() && steps.scope.outputs.e2e == 'true'
        env:
          TREE: ${{ steps.green-key.outputs.tree }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf 'tree=%s\nhead=%s\nrun=%s\n' "$TREE" "$HEAD_SHA" "$RUN_URL" > "$RUNNER_TEMP/ci-green"
      - name: Save green run
        if: success() && steps.scope.outputs.e2e == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ci-green
          key: ${{ steps.green.outputs.cache-primary-key }}
