name: CI

# Type-check, lint and unit tests on every push and pull request.
# Vercel deploys from Git on its own. To make a red run block production, add the "Nashr CI" check under
# Vercel project Settings > Build and Deployment > Deployment Checks (provider: GitHub).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Vercel Deployment Checks identify a check by this job name. Renaming it means re-selecting it in Vercel.
    name: Nashr CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint
      - name: Unit tests
        run: npx vitest run
