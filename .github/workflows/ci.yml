name: CI

# Type-check, lint and unit tests on every push and pull request.
# Note: Vercel deploys from Git on its own. To make a red run block production,
# enable "Required checks" for this workflow in the Vercel project's Git settings.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npx eslint
      - name: Unit tests
        run: npx vitest run
