# Secret scan settings for the CI "Secret scan" step (.github/workflows/ci.yml, rule 1355).
# The full default rule set, plus one allowance: the generic "looks like a key" rule fires on the made-up values the unit
# tests, the study reports and the .archify diagrams use. Every specific rule (AWS, GitHub, Stripe, Anthropic, private
# keys, ...) still runs on those paths. Never add a real value's path here: rotate the value instead.
title = "Thakeen secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Fake values in tests, study reports and diagrams"
targetRules = ["generic-api-key"]
paths = ['''^tests/''', '''^docs/reports/''', '''^\.archify/''']
